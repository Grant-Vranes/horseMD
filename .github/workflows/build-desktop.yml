name: Build Desktop Packages

# This workflow REPLACES release.yml (deleted): it runs on the same v* tags
# (v*-dev* excluded: those go to develop-build.yml), builds all three platforms,
# and uploads every artifact to the GitHub Release created here. It can also run
# manually (workflow_dispatch) with an optional version override to produce test
# installers as workflow artifacts only.

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.13.211). Leave empty to use package.json'
        required: false
        type: string

# Required to create the release and upload assets on tag builds.
permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  # Never cancel a running release build.
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Linux: electron-builder needs libgtk-3-dev and libnotify for desktop
      # integration metadata; dpkg-deb is used to verify the .deb artifact.
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev dpkg

      - name: Install dependencies
        run: npm ci

      # resources/drawio is gitignored and must be vendored before packaging
      # (electron-builder copies it via extraResources). npm run dist does
      # this locally; do it explicitly here so every step stays visible.
      - name: Vendor drawio resources
        run: node scripts/fetch-drawio.mjs

      - name: Apply version override (manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: bash
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          echo "Overrode version to $(node -p "require('./package.json').version")"

      - name: Derive tag version (tag trigger)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Set version to $VERSION from tag $TAG"

      - name: Build bundles (main + preload + renderer)
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Releases are unsigned; skip codesign identity discovery so the
          # macOS build does not fail looking for signing certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Linux: verify the .deb is a valid package (not a zero-byte stub from
      # cross-build). Cross-building .deb on macOS produces an invalid ~96-byte
      # file, so this check must run on a real Ubuntu runner.
      - name: Verify Linux .deb artifact
        if: matrix.platform == 'linux'
        run: |
          DEB_FILE=$(ls dist/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb file found in dist/"
            exit 1
          fi
          echo "Found: $DEB_FILE"
          echo "Size: $(stat -c%s "$DEB_FILE") bytes"
          dpkg-deb --info "$DEB_FILE"
          echo "✅ .deb artifact is valid"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HorseMD-desktop-${{ matrix.platform }}-${{ github.run_number }}
          # latest*.yml (latest.yml / latest-mac.yml / latest-linux.yml) and the
          # blockmap files are the electron-updater feed; keep them alongside
          # the installers so both manual test builds and releases are
          # auto-update complete.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      # Tag builds only: publish all assets to the GitHub Release for the tag.
      # This creates the release if missing (published, not draft) and is safe
      # to rerun — matching assets are replaced.
      - name: Release (tag trigger)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.deb
            dist/latest*.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
