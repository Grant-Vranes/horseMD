name: CI

# Sanity check on every push / PR: make sure the app still bundles cleanly.
# This does NOT package installers (that only runs on tags, in build-desktop.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Core regression tests
        run: npm run test:core

      - name: Install guide dependencies
        run: npm ci --prefix guide

      - name: Audit guide dependencies
        run: npm audit --prefix guide --audit-level=high

      - name: Guide content and build
        run: npm run guide:check

      - name: Build (main + preload + renderer)
        run: npm run build
