name: Develop Build

# Multi-platform test builds for the develop branch, triggered by dev tags.
# Push a tag such as `v0.13.210-dev.1` (pattern: v*-dev*) on a develop commit
# and all three platforms are packaged. Artifacts are uploaded to the workflow
# run only; this never creates or updates a GitHub Release (that is release.yml's
# job on plain v* tags).
on:
  push:
    tags:
      - 'v*-dev*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Linux: electron-builder needs libgtk-3-dev and libnotify for desktop
      # integration metadata; dpkg-deb is used to verify the .deb artifact.
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # Linux: verify the .deb is a valid package (not a zero-byte stub from
      # cross-build). Cross-building .deb on macOS produces an invalid ~96-byte
      # file, so this check must run on a real Ubuntu runner.
      - name: Verify Linux .deb artifact
        if: matrix.platform == 'linux'
        run: |
          DEB_FILE=$(ls dist/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb file found in dist/"
            exit 1
          fi
          echo "Found: $DEB_FILE"
          echo "Size: $(stat -c%s "$DEB_FILE") bytes"
          dpkg-deb --info "$DEB_FILE"
          echo "✅ .deb artifact is valid"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HorseMD-${{ matrix.platform }}-${{ github.run_number }}
          # latest.yml + the .exe.blockmap are the electron-updater feed files,
          # kept alongside the installer so a develop build can be fully
          # validated (and later promoted to a release) if needed.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.zip
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
